name: Publish rattr 0.2.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish 0.2.5 to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Check out v0.2.5
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.2.5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install build tools
        run: |
          python -m pip install --upgrade --disable-pip-version-check pip
          python -m pip install --upgrade build twine

      - name: Build 0.2.5
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RATTR: "0.2.5"
        run: |
          python -m build

      - name: Verify version before upload
        run: |
          ls -la dist

          test -f dist/rattr-0.2.5-py3-none-any.whl
          test -f dist/rattr-0.2.5.tar.gz

          python -m twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload \
            --verbose \
            --username "__token__" \
            dist/*
